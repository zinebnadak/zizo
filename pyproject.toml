[project]
name = "zizo"
version = "0.1.0"
description = "My absolute personal assistant"
readme = "README.md"
authors = [
    { name = "zinebnadak", email = "zineb@nadak.ai" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.6.0",
    "python-dotenv>=1.2.4",
    "typer>=0.27.3",
]

[project.scripts]
zizo = "zizo.cli:app"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
